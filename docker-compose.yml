services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agriconnect
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agriconnect"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://agri:agri@db:5432/agriconnect
      JWT_SECRET: change-this-to-a-long-random-secret-of-at-least-32-chars
    ports: ["8000:8000"]
volumes:
  pgdata:
